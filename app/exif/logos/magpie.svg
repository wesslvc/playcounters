<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 1.slvc: the azure-winged magpie. Flat shapes, parted by even transparent gaps (the mask). -->
  <defs>
    <clipPath id="tail-clip">
      <path d="M256 300 C 200 332, 132 396, 80 460 Q 70 474, 86 474 C 142 420, 214 360, 278 328 Z"/>
    </clipPath>
    <mask id="gaps" maskUnits="userSpaceOnUse" x="-200" y="-200" width="912" height="912">
      <rect x="-200" y="-200" width="912" height="912" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round" transform="translate(256 256) scale(1.12) translate(-258 -292)">
        <!-- cap / body -->
        <path stroke-width="4.5" d="M304 166 C 330 176, 370 176, 401 162"/>
        <!-- beak / cap -->
        <path stroke-width="4" d="M399 140 L 403 163"/>
        <!-- wing edge -->
        <path stroke-width="4.5" d="M346 186 C 368 214, 352 268, 304 287 C 272 300, 238 304, 212 318"/>
        <!-- eye ring -->
        <circle cx="371" cy="141" r="6.2" stroke-width="2.2"/>
      </g>
    </mask>
  </defs>
  <g mask="url(#gaps)">
    <g transform="translate(256 256) scale(1.12) translate(-258 -292)">
      <!-- tail, with its pale tip -->
      <path d="M256 300 C 200 332, 132 396, 80 460 Q 70 474, 86 474 C 142 420, 214 360, 278 328 Z" fill="#4F6680"/>
      <polygon points="76,418 124,476 60,560 -20,470" fill="#D9D3CA" clip-path="url(#tail-clip)"/>
      <!-- body and lower head -->
      <path d="M318 134 C 352 122, 398 134, 400 166 C 404 200, 392 226, 387 250 C 382 302, 334 336, 278 336 C 244 336, 222 330, 206 322 C 236 284, 266 224, 300 190 C 306 170, 308 148, 318 134 Z" fill="#D9D3CA"/>
      <!-- wing -->
      <path d="M346 186 C 368 214, 352 268, 304 287 C 272 300, 238 304, 212 318 C 238 272, 284 212, 346 186 Z" fill="#6E86A0"/>
      <!-- black cap, down past the eye -->
      <path d="M302 168 C 302 138, 326 116, 356 115 C 384 114, 402 130, 404 150 L 402 162 C 370 176, 332 176, 302 168 Z" fill="#1C1B1A"/>
      <!-- beak -->
      <path d="M401 141 L 444 151 L 403 162 Z" fill="#1C1B1A"/>
      <!-- eye -->
      <circle cx="371" cy="141" r="4.2" fill="#1C1B1A"/>
      <!-- legs -->
      <g stroke="#1C1B1A" stroke-width="5" stroke-linecap="round">
        <path d="M292 334 L 286 364"/>
        <path d="M313 333 L 309 364"/>
      </g>
    </g>
  </g>
</svg>
